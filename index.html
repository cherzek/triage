<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triage - Student Priority Report</title>
    <!-- Favicon updated to Emerald 600 (#059669) -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M30,15 a10,10 0 0 0 -20,0 v15 h10 v-15 M70,15 a10,10 0 0 1 20,0 v15 h-10 v-15 M30,15 v40 a20,20 0 1 0 40,0 v-40' fill='none' stroke='%23059669' stroke-width='6' stroke-linecap='round'/%3E%3Ccircle cx='50' cy='75' r='15' fill='white' stroke='%23059669' stroke-width='6'/%3E%3Ccircle cx='50' cy='75' r='5' fill='%23059669'/%3E%3C/svg%3E" type="image/svg+xml">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PapaParse (CSV Parsing Library) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@300;400;500&display=swap');

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f8f9fa;
        }

        h1, h2, h3, button, .font-google {
            font-family: 'Google Sans', sans-serif;
        }

        #drop-zone {
            border: 2px dashed #dadce0;
            transition: all 0.2s ease-in-out;
        }

        #drop-zone.drag-over {
            border-color: #059669;
            background-color: #ecfdf5;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #dadce0;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #05966988;
        }
    </style>
</head>
<body class="antialiased text-gray-700">

    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-2xl bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden">
            
            <!-- Emerald 600 Header -->
            <div class="bg-emerald-600 p-6 text-white relative">
                <div class="flex items-center space-x-4">
                    <div class="p-3 bg-white/20 rounded-lg">
                        <svg class="w-8 h-8 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" />
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold tracking-tight">Triage</h1>
                        <p class="text-emerald-100 text-sm opacity-90">Student Priority Report Generator</p>
                    </div>
                </div>
            </div>

            <div class="p-6 sm:p-8 space-y-8">
                
                <!-- Step 1: Upload -->
                <section>
                    <div class="flex items-center mb-4">
                        <span class="flex items-center justify-center w-6 h-6 rounded-full bg-emerald-100 text-emerald-700 text-xs font-bold mr-2">1</span>
                        <h2 class="text-lg font-medium text-gray-900">Upload Data</h2>
                    </div>
                    
                    <p class="text-sm text-gray-500 mb-4 ml-8 leading-relaxed">
                        Required CSV columns: <code class="bg-gray-100 px-1.5 py-0.5 rounded text-emerald-700 border border-gray-200">student_Id</code>, <code class="bg-gray-100 px-1.5 py-0.5 rounded text-emerald-700 border border-gray-200">course_code</code>, <code class="bg-gray-100 px-1.5 py-0.5 rounded text-emerald-700 border border-gray-200">markingPeriod_Average</code>.
                    </p>
                    
                    <div class="ml-8">
                        <div id="drop-zone" class="relative rounded-xl p-8 text-center cursor-pointer hover:bg-gray-50 transition-colors">
                            <input type="file" id="file-input" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" accept=".csv" multiple>
                            <div class="flex flex-col items-center justify-center space-y-3 pointer-events-none">
                                <svg class="w-10 h-10 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.2" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0l-3 3m3-3l3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z" />
                                </svg>
                                <p class="text-gray-600 text-sm">
                                    <span class="font-medium text-emerald-600">Select files</span> or drag and drop
                                </p>
                            </div>
                        </div>
                        <div id="file-list" class="mt-3 text-sm text-gray-600 font-medium"></div>
                    </div>
                </section>

                <hr class="border-gray-100">

                <!-- Step 2: Settings -->
                <section>
                    <div class="flex items-center mb-4">
                        <span class="flex items-center justify-center w-6 h-6 rounded-full bg-emerald-100 text-emerald-700 text-xs font-bold mr-2">2</span>
                        <h2 class="text-lg font-medium text-gray-900">Parameters</h2>
                    </div>
                    
                    <div class="ml-8 grid grid-cols-1 sm:grid-cols-2 gap-6 items-end">
                        <div class="space-y-2">
                            <label for="passing-grade" class="block text-sm font-medium text-gray-600 uppercase tracking-wider">Passing Grade Threshold</label>
                            <input type="number" id="passing-grade" value="65" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all">
                        </div>
                        
                        <div class="pb-2">
                            <a href="#" id="download-template" class="inline-flex items-center text-emerald-600 hover:text-emerald-800 text-sm font-medium transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-4 h-4 mr-1.5">
                                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm.75-11.25a.75.75 0 00-1.5 0v4.59L7.3 9.7a.75.75 0 00-1.1 1.02l3.25 3.5a.75.75 0 001.1 0l3.25-3.5a.75.75 0 10-1.1-1.02l-1.95 2.1V6.75z" clip-rule="evenodd" />
                                </svg>
                                Download Template
                            </a>
                        </div>
                    </div>
                </section>

                <!-- Step 3: Action -->
                <section class="pt-4">
                    <button id="generate-btn" class="w-full bg-emerald-600 text-white font-bold py-3.5 px-6 rounded-lg shadow hover:bg-emerald-700 active:bg-emerald-800 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2 transition-all duration-200 flex items-center justify-center">
                        <svg id="icon-default" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 mr-2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 003 8.25v10.5A2.25 2.25 0 005.25 21h10.5A2.25 2.25 0 0018 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25" />
                        </svg>
                        <svg id="icon-loading" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <span id="btn-text">Generate Report</span>
                    </button>
                    <p id="status-msg" class="text-center text-red-500 mt-4 text-sm font-medium h-5"></p>
                </section>
            </div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const fileListDisplay = document.getElementById('file-list');
        const passingGradeInput = document.getElementById('passing-grade');
        const generateBtn = document.getElementById('generate-btn');
        const statusMsg = document.getElementById('status-msg');
        const downloadTemplateBtn = document.getElementById('download-template');
        const iconDefault = document.getElementById('icon-default');
        const iconLoading = document.getElementById('icon-loading');
        const btnText = document.getElementById('btn-text');

        let uploadedFiles = [];

        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
        dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('drag-over'); });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            const files = Array.from(e.dataTransfer.files).filter(f => f.type === 'text/csv' || f.name.endsWith('.csv'));
            handleFiles(files);
        });
        fileInput.addEventListener('change', () => handleFiles(Array.from(fileInput.files)));

        function handleFiles(files) {
            uploadedFiles = files;
            if (uploadedFiles.length > 0) {
                fileListDisplay.innerHTML = `<span class="text-emerald-600">Selected:</span> ${uploadedFiles.map(f => f.name).join(', ')}`;
                statusMsg.textContent = '';
            } else { fileListDisplay.innerHTML = ''; }
        }

        downloadTemplateBtn.addEventListener('click', (e) => {
            e.preventDefault();
            const csvContent = "student_Id,Student_FirstName,Student_LastName,course_code,markingPeriod_Average\n200000001,John,Doe,MGS21,62.5";
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.setAttribute("href", URL.createObjectURL(blob));
            link.setAttribute("download", "triage_template.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        generateBtn.addEventListener('click', async () => {
            if (uploadedFiles.length === 0) { statusMsg.textContent = 'Please upload at least one CSV file.'; return; }
            setLoadingState(true);
            try {
                const passingGrade = parseFloat(passingGradeInput.value) || 65.0;
                const failingStudents = await processStudentData(uploadedFiles, passingGrade);
                const categorizedLists = categorizeStudents(failingStudents);
                const reportHTML = generateReportHTML(categorizedLists, passingGrade);
                const newWindow = window.open('', '_blank');
                if (newWindow) {
                    newWindow.document.write(reportHTML);
                    newWindow.document.close();
                    statusMsg.className = "text-center text-emerald-600 mt-4 text-sm font-medium h-5";
                    statusMsg.textContent = 'Report ready in new tab!';
                    setTimeout(() => { statusMsg.textContent = ''; }, 3000);
                } else { throw new Error('Pop-up blocked.'); }
            } catch (error) {
                statusMsg.className = "text-center text-red-500 mt-4 text-sm font-medium h-5";
                statusMsg.textContent = `Error: ${error.message}`;
            } finally { setLoadingState(false); }
        });

        function setLoadingState(isLoading) {
            if (isLoading) {
                btnText.textContent = 'Processing...';
                iconDefault.classList.add('hidden');
                iconLoading.classList.remove('hidden');
                generateBtn.disabled = true;
            } else {
                btnText.textContent = 'Generate Report';
                iconDefault.classList.remove('hidden');
                iconLoading.classList.add('hidden');
                generateBtn.disabled = false;
            }
        }

        async function processStudentData(files, passingGrade) {
            const failingStudents = new Map();
            const parseFile = (file) => new Promise((resolve, reject) => {
                Papa.parse(file, {
                    header: true, skipEmptyLines: true,
                    step: (row) => {
                        const data = row.data;
                        const studentId = data.student_Id?.trim();
                        if (!studentId) return;
                        const grade = parseFloat(data.markingPeriod_Average?.trim());
                        if (isNaN(grade) || grade >= passingGrade) return;
                        if (!failingStudents.has(studentId)) {
                            failingStudents.set(studentId, { name: `${data.Student_FirstName || ''} ${data.Student_LastName || ''}`.trim(), courses: {} });
                        }
                        failingStudents.get(studentId).courses[data.course_code?.trim() || 'N/A'] = grade;
                    },
                    complete: () => resolve(),
                    error: (err) => reject(err)
                });
            });
            await Promise.all(files.map(parseFile));
            return failingStudents;
        }

        function categorizeStudents(failingStudents) {
            const lists = { High: [], Medium: [], Low: [] };
            failingStudents.forEach((data, studentId) => {
                const coursesList = Object.entries(data.courses).map(([code, gr]) => ({ course: code, grade: gr }));
                coursesList.sort((a, b) => a.grade - b.grade);
                const failCount = coursesList.length;
                if (failCount === 0) return;
                const entry = { id: studentId, name: data.name, fail_count: failCount, courses: coursesList };
                if (failCount >= 5) lists.High.push(entry);
                else if (failCount >= 3) lists.Medium.push(entry);
                else lists.Low.push(entry);
            });
            for (const key in lists) lists[key].sort((a, b) => b.fail_count - a.fail_count);
            return lists;
        }

        function generateReportHTML(priorityLists, passingGrade) {
            return `
            <!DOCTYPE html>
            <html>
            <head>
                <style>
                    @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500&display=swap');
                    body { font-family: 'Roboto', sans-serif; margin: 40px; color: #3c4043; line-height: 1.5; }
                    .report-header { border-bottom: 2px solid #059669; padding-bottom: 20px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: flex-end; }
                    h1 { font-family: 'Google Sans', sans-serif; font-size: 28px; margin: 0; color: #059669; }
                    .meta { font-size: 13px; color: #70757a; text-align: right; }
                    h2 { font-family: 'Google Sans', sans-serif; font-size: 20px; border-left: 4px solid #dadce0; padding-left: 12px; margin: 40px 0 20px 0; color: #202124; }
                    .priority-high { border-left-color: #d93025; color: #d93025; }
                    .priority-medium { border-left-color: #f9ab00; color: #e37400; }
                    .priority-low { border-left-color: #059669; color: #059669; }
                    .student-block { margin-bottom: 30px; break-inside: avoid; }
                    .student-info { display: flex; justify-content: space-between; align-items: center; background: #f8f9fa; padding: 10px 15px; border-radius: 8px; margin-bottom: 10px; }
                    .student-name { font-weight: 500; font-size: 16px; font-family: 'Google Sans', sans-serif; }
                    .fail-pill { background: #feeae6; color: #d93025; padding: 2px 10px; font-size: 12px; font-weight: bold; border-radius: 20px; }
                    table { width: 100%; border-collapse: collapse; font-size: 14px; }
                    th { text-align: left; color: #70757a; font-weight: 500; border-bottom: 1px solid #dadce0; padding: 8px 15px; text-transform: uppercase; font-size: 11px; }
                    td { padding: 10px 15px; border-bottom: 1px dotted #dadce0; }
                    .grade-fail { color: #d93025; font-weight: 500; }
                    #print-bar { position: sticky; top: 0; background: white; padding: 15px 0; border-bottom: 1px solid #eee; margin-bottom: 20px; z-index: 10; display: flex; justify-content: center; }
                    button { background: #059669; color: white; border: none; padding: 10px 24px; border-radius: 4px; font-family: 'Google Sans', sans-serif; cursor: pointer; font-weight: 500; }
                    @media print { #print-bar { display: none; } body { margin: 20px; } }
                </style>
            </head>
            <body>
                <div id="print-bar"><button onclick="window.print()">Print Report / Save PDF</button></div>
                <div class="report-header">
                    <div><h1>Mandated Tutoring Priority Report</h1></div>
                    <div class="meta">Generated: ${new Date().toLocaleString()}<br>Failing grade: < ${passingGrade}</div>
                </div>
                <h2 class="priority-high">HIGH PRIORITY (${priorityLists.High.length} Students)</h2>
                ${renderTable(priorityLists.High)}
                <h2 class="priority-medium">MEDIUM PRIORITY (${priorityLists.Medium.length} Students)</h2>
                ${renderTable(priorityLists.Medium)}
                <h2 class="priority-low">LOW PRIORITY (${priorityLists.Low.length} Students)</h2>
                ${renderTable(priorityLists.Low)}
            </body>
            </html>`;
        }

        function renderTable(students) {
            if (students.length === 0) return "<p style='color:#70757a; font-style:italic;'>None found.</p>";
            return students.map(s => `
                <div class="student-block">
                    <div class="student-info">
                        <span class="student-name">${s.name} <span style="font-weight:400; color:#70757a; font-size:13px;">(ID: ${s.id})</span></span>
                        <span class="fail-pill">${s.fail_count} FAILS</span>
                    </div>
                    <table>
                        <thead><tr><th>Course Code</th><th style="text-align:right">Current Grade</th></tr></thead>
                        <tbody>${s.courses.map(c => `<tr><td>${c.course}</td><td style="text-align:right" class="grade-fail">${c.grade.toFixed(2)}</td></tr>`).join('')}</tbody>
                    </table>
                </div>`).join('');
        }
    </script>
</body>
</html>
